name: Step Functions CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-synth:
    name: test-and-synth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install CDK CLI
        run: npm install --global "aws-cdk@${CDK_CLI_VERSION}"
        env:
          CDK_CLI_VERSION: ${{ vars.CDK_CLI_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -v

      - name: Synthesize CloudFormation template
        run: cdk synth StepWorkflowStack

  deploy-dev:
    name: deploy-dev
    needs: test-and-synth

    environment: default

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install CDK CLI
        run: npm install --global "aws-cdk@${CDK_CLI_VERSION}"
        env:
          CDK_CLI_VERSION: ${{ vars.CDK_CLI_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify target AWS account
        shell: bash
        run: |
          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account --output text)"

          echo "Authenticated AWS account: ${ACTUAL_ACCOUNT_ID}"

          if [ "$ACTUAL_ACCOUNT_ID" != "$EXPECTED_AWS_ACCOUNT_ID" ]; then
            echo "::error::AWS account mismatch. Deployment cancelled."
            exit 1
          fi

      - name: Review infrastructure changes
        run: cdk diff StepWorkflowStack

      - name: Deploy to Dev
        run: cdk deploy StepWorkflowStack --require-approval never